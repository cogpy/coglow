name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v3

    - name: Set up compiler
      uses: egor-tensin/setup-gcc@v1
      if: matrix.compiler == 'gcc'
      with:
        version: 11

    - name: Set up Clang
      uses: egor-tensin/setup-clang@v1
      if: matrix.compiler == 'clang'
      with:
        version: 14

    - name: Cache googletest
      id: cache-googletest
      uses: actions/cache@v3
      with:
        path: googletest-src
        key: ${{ runner.os }}-googletest

    - name: Clone googletest
      if: steps.cache-googletest.outputs.cache-hit != 'true'
      uses: actions/checkout@v3
      with:
        repository: google/googletest
        path: googletest-src
        ref: release-1.12.1

    - name: Build and install googletest
      run: |
        cmake -S googletest-src -B googletest-build -DCMAKE_INSTALL_PREFIX=/usr/local
        cmake --build googletest-build
        sudo cmake --install googletest-build

    - name: Configure CMake
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc-11' || 'clang-14' }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++-11' || 'clang++-14' }}

    - name: Build
      run: cmake --build build -- -j2

    - name: Run tests
      working-directory: ./build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
